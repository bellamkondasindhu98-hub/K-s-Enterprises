<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | K's Enterprises - Premium Fish Feed</title>
  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="../../components/navbar/navbar.css">
  <link rel="stylesheet" href="../../components/footer/footer.css">
  <link rel="stylesheet" href="./reset-password.css">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Set New Password</h1>
          <p>Please enter and confirm your new secure password</p>
        </div>

        <div id="message-box" style="display: none; padding: 0.75rem; background-color: var(--success-bg); color: var(--success-color); border-radius: var(--border-radius); margin-bottom: 1rem; text-align: center; font-size: 0.9rem;"></div>
        <div id="reset-error" class="form-error" style="display: none; padding: 0.75rem; background-color: var(--danger-bg); border-radius: var(--border-radius); margin-bottom: 1rem; text-align: center;"></div>

        <form id="reset-form">
          <div class="form-group">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" id="newPassword" class="form-input" required minlength="6" placeholder="Min. 6 characters" autocomplete="new-password">
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm New Password</label>
            <input type="password" id="confirmPassword" class="form-input" required minlength="6" placeholder="Re-enter new password" autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            Update Password
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
          <a href="../login/index.html" class="font-bold">Return to Login</a>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <!-- Scripts -->
  <script src="../../services/api.service.js"></script>
  <script src="../../services/auth.service.js"></script>
  <script src="../../services/theme.service.js"></script>
  <script src="../../services/i18n.service.js"></script>
  <script src="../../components/navbar/navbar.js"></script>
  <script src="../../components/footer/footer.js"></script>
  <script src="./reset-password.js"></script>
</body>
</html>
