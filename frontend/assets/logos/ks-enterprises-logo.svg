<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon: Stylized Fish & Growth Ring -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="38" fill="url(#logoGrad)" />
    <!-- Dynamic Fish Shape -->
    <path d="M 22,40 C 28,26 48,24 60,40 C 48,56 28,54 22,40 Z" fill="#ffffff" />
    <path d="M 56,40 L 68,30 L 68,50 Z" fill="#ffffff" />
    <circle cx="32" cy="37" r="3" fill="#0284c7" />
    <!-- Water ripples/pellets -->
    <circle cx="20" cy="25" r="3" fill="#bae6fd" />
    <circle cx="60" cy="22" r="2.5" fill="#bae6fd" />
    <circle cx="62" cy="58" r="3" fill="#bae6fd" />
  </g>

  <!-- Typography -->
  <text x="100" y="48" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#0284c7" letter-spacing="-0.5">
    K's <tspan fill="#0f172a">ENTERPRISES</tspan>
  </text>
  <text x="102" y="72" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#64748b" letter-spacing="2">
    PREMIUM AQUACULTURE FEEDS
  </text>
</svg>
