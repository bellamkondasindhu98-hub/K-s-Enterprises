<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Directory | Admin - K's Enterprises</title>
  <link rel="stylesheet" href="../../styles/admin-main.css">
  <link rel="stylesheet" href="../../styles/admin-forms.css">
  <link rel="stylesheet" href="../../components/admin-sidebar/admin-sidebar.css">
  <link rel="stylesheet" href="../../components/admin-navbar/admin-navbar.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <main class="admin-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--admin-text-main);">Registered Customers</h1>
            <p style="color: var(--admin-text-muted); font-size: 0.9rem;">View registered farmers, dealers, and aquaculture clients</p>
          </div>
          <div>
            <input type="text" id="customer-search-input" placeholder="Search by name, email, phone..." class="form-control" style="width: 280px; padding: 0.6rem 1rem;">
          </div>
        </div>

        <div class="admin-card">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Customer Name</th>
                  <th>Email</th>
                  <th>Phone Number</th>
                  <th>City / State</th>
                  <th>Auth Provider</th>
                  <th>Registered Date</th>
                </tr>
              </thead>
              <tbody id="customers-table-body">
                <tr>
                  <td colspan="7" style="text-align: center; padding: 2rem; color: var(--admin-text-muted);">Loading customers...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../services/admin-api.service.js"></script>
  <script src="../../services/admin-auth.service.js"></script>
  <script src="../../services/admin-management.service.js"></script>
  <script src="../../components/admin-sidebar/admin-sidebar.js"></script>
  <script src="../../components/admin-navbar/admin-navbar.js"></script>
  <script src="./customers.js"></script>
</body>
</html>
