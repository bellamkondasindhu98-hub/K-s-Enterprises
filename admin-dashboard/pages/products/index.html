<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Product Management | K's Enterprises</title>
  <link rel="stylesheet" href="../../styles/admin-main.css">
  <link rel="stylesheet" href="../../styles/admin-forms.css">
  <link rel="stylesheet" href="../../components/admin-sidebar/admin-sidebar.css">
  <link rel="stylesheet" href="../../components/admin-navbar/admin-navbar.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <main class="admin-content">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
          <div>
            <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--admin-text-main);">Product Inventory</h1>
            <p style="color: var(--admin-text-muted); font-size: 0.9rem;">Manage feeds, update specifications, and toggle stock availability</p>
          </div>
          <button class="btn-admin btn-admin-primary" onclick="openAddProductModal()">
            ➕ Add New Product
          </button>
        </div>

        <div class="admin-table-box">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Product Name & Specs</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-products-tbody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Add/Edit Product Modal -->
  <div class="admin-modal-overlay" id="product-modal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h3 id="modal-title" style="font-size: 1.25rem; font-weight: 700;">Add New Product</h3>
        <button type="button" class="btn-admin btn-admin-outline" onclick="closeProductModal()">✕</button>
      </div>

      <form id="product-form">
        <input type="hidden" id="edit-product-id">

        <div class="admin-form-group">
          <label for="form-name" class="admin-form-label">Product Name *</label>
          <input type="text" id="form-name" class="admin-form-input" required placeholder="e.g. AquaGrow Floating Feed 28%">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="admin-form-group">
            <label for="form-category" class="admin-form-label">Category *</label>
            <select id="form-category" class="admin-form-select" required>
              <option value="1">Floating Pellets</option>
              <option value="2">Sinking Pellets</option>
              <option value="3">Starter Crumbles</option>
              <option value="4">Broodstock Special</option>
            </select>
          </div>

          <div class="admin-form-group">
            <label for="form-price" class="admin-form-label">Price (₹) *</label>
            <input type="number" step="0.01" id="form-price" class="admin-form-input" required placeholder="1650.00">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="admin-form-group">
            <label for="form-feed-type" class="admin-form-label">Feed Type</label>
            <input type="text" id="form-feed-type" class="admin-form-input" placeholder="Floating Pellets">
          </div>

          <div class="admin-form-group">
            <label for="form-package-size" class="admin-form-label">Package Size</label>
            <input type="text" id="form-package-size" class="admin-form-input" placeholder="40 kg Bag">
          </div>
        </div>

        <div class="admin-form-group">
          <label for="form-suitable-fish" class="admin-form-label">Suitable Fish Species</label>
          <input type="text" id="form-suitable-fish" class="admin-form-input" placeholder="Tilapia, Rohu, Pangasius">
        </div>

        <div class="admin-form-group">
          <label for="form-specs" class="admin-form-label">Specifications (Size, Stability, etc.)</label>
          <input type="text" id="form-specs" class="admin-form-input" placeholder="Pellet: 3mm | Stability: 3+ Hours">
        </div>

        <div class="admin-form-group">
          <label for="form-description" class="admin-form-label">Description</label>
          <textarea id="form-description" class="admin-form-textarea" placeholder="Detailed product description..."></textarea>
        </div>

        <div class="admin-form-group">
          <label for="form-availability" class="admin-form-label">Stock Availability *</label>
          <select id="form-availability" class="admin-form-select">
            <option value="AVAILABLE">AVAILABLE</option>
            <option value="OUT_OF_STOCK">OUT OF STOCK</option>
          </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn-admin btn-admin-outline" onclick="closeProductModal()">Cancel</button>
          <button type="submit" class="btn-admin btn-admin-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../services/admin-api.service.js"></script>
  <script src="../../services/admin-auth.service.js"></script>
  <script src="../../services/admin-management.service.js"></script>
  <script src="../../components/admin-sidebar/admin-sidebar.js"></script>
  <script src="../../components/admin-navbar/admin-navbar.js"></script>
  <script src="./products.js"></script>
</body>
</html>
