<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Product Comparison Manager | K's Enterprises</title>
  <link rel="stylesheet" href="../../styles/admin-main.css">
  <link rel="stylesheet" href="../../styles/admin-forms.css">
  <link rel="stylesheet" href="../../components/admin-sidebar/admin-sidebar.css">
  <link rel="stylesheet" href="../../components/admin-navbar/admin-navbar.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <main class="admin-content">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
          <div>
            <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--admin-text-main);">Product Comparison Data</h1>
            <p style="color: var(--admin-text-muted); font-size: 0.9rem;">Manage factual competitor benchmarks displayed on customer comparison matrices</p>
          </div>
          <button class="btn-admin btn-admin-primary" onclick="openAddCompModal()">
            ➕ Add Competitor Product
          </button>
        </div>

        <div class="admin-table-box">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Competitor Name</th>
                <th>Price</th>
                <th>Protein Content</th>
                <th>Package & Feed Type</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-comparisons-tbody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Competitor Modal -->
  <div class="admin-modal-overlay" id="comp-modal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h3 style="font-size: 1.25rem; font-weight: 700;">Add Competitor Benchmark Product</h3>
        <button type="button" class="btn-admin btn-admin-outline" onclick="closeCompModal()">✕</button>
      </div>

      <form id="comp-form">
        <div class="admin-form-group">
          <label for="comp-name" class="admin-form-label">Competitor Product Name *</label>
          <input type="text" id="comp-name" class="admin-form-input" required placeholder="e.g. Brand B Growth Feed">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="admin-form-group">
            <label for="comp-price" class="admin-form-label">Market Price (₹) *</label>
            <input type="number" step="0.01" id="comp-price" class="admin-form-input" required placeholder="1720.00">
          </div>
          <div class="admin-form-group">
            <label for="comp-protein" class="admin-form-label">Protein Content *</label>
            <input type="text" id="comp-protein" class="admin-form-input" required placeholder="26%">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="admin-form-group">
            <label for="comp-package" class="admin-form-label">Package Size *</label>
            <input type="text" id="comp-package" class="admin-form-input" required placeholder="40 kg">
          </div>
          <div class="admin-form-group">
            <label for="comp-feed" class="admin-form-label">Feed Type *</label>
            <input type="text" id="comp-feed" class="admin-form-input" required placeholder="Floating Pellets">
          </div>
        </div>

        <div class="admin-form-group">
          <label for="comp-fish" class="admin-form-label">Suitable Fish Species *</label>
          <input type="text" id="comp-fish" class="admin-form-input" required placeholder="Tilapia, Pangasius">
        </div>

        <div class="admin-form-group">
          <label for="comp-avail" class="admin-form-label">Market Availability</label>
          <select id="comp-avail" class="admin-form-select">
            <option value="Available">Available</option>
            <option value="Out of Stock">Out of Stock</option>
          </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn-admin btn-admin-outline" onclick="closeCompModal()">Cancel</button>
          <button type="submit" class="btn-admin btn-admin-primary">Save Benchmark</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../services/admin-api.service.js"></script>
  <script src="../../services/admin-auth.service.js"></script>
  <script src="../../services/admin-management.service.js"></script>
  <script src="../../components/admin-sidebar/admin-sidebar.js"></script>
  <script src="../../components/admin-navbar/admin-navbar.js"></script>
  <script src="./comparison.js"></script>
</body>
</html>
