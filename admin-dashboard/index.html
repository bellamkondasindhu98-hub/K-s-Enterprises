<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K's Enterprises - Admin Portal</title>
  <script>
    (function() {
      const token = localStorage.getItem('ks_admin_token');
      if (token) {
        window.location.replace('pages/dashboard/index.html');
      } else {
        window.location.replace('pages/login/index.html');
      }
    })();
  </script>
</head>
<body>
  <p style="text-align: center; margin-top: 2rem; font-family: sans-serif; color: #64748B;">
    Redirecting to Admin Portal...
  </p>
</body>
</html>
