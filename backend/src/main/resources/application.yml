server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ks-enterprises-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ks_enterprises_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # File upload limits (for product and logo images)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Application specific settings
app:
  jwt:
    # 256-bit base64 secret key for signing tokens
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 Hours

  # Configurable Company WhatsApp Order Configuration (Dynamic & Centralized)
  whatsapp:
    default-number: ${COMPANY_WHATSAPP_NUMBER:+91XXXXXXXXXX} # Replace with actual verified WhatsApp business number
    order-greeting: "Hello K's Enterprises,"
    order-footer: "I would like to place an order. Thank you."

  # Placeholders for unconfigured company details
  company:
    name: "K's Enterprises"
    email: "contact@ksenterprises.com"
    phone: "+91-XXXXXXXXXX"
    gst: "[GST_NUMBER_PLACEHOLDER]"
    address: "[COMPANY_ADDRESS_PLACEHOLDER]"

  # Allowed CORS origins
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5500"
      - "http://localhost:8080"
      - "http://127.0.0.1:5500"
      - "http://127.0.0.1:3000"
      - "http://localhost:8000"
      - "http://127.0.0.1:8000"
